<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Beezos — Your web OS</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#111827}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}.os{height:100dvh;min-height:640px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 75% 15%,#566a9c,transparent 35%),radial-gradient(ellipse at 20% 85%,#243d58,transparent 50%),linear-gradient(135deg,#111827,#263453)}.bar{height:34px;background:#10182766;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:10px}.bee{width:36px;height:36px;image-rendering:pixelated}.hero{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(730px,calc(100% - 34px));text-align:center}.hero .bee{width:80px;height:80px}.eyebrow{font-size:10px;letter-spacing:.22em;color:#c1c9d8}.hero h1{font-size:clamp(44px,6vw,68px);letter-spacing:-.07em;margin:2px 0}.sub{color:#c4cbda;margin:7px 0 24px}.search{display:flex;align-items:center;gap:10px;background:#fff;color:#273044;border-radius:17px;padding:8px 10px 8px 16px;max-width:590px;margin:auto;box-shadow:0 15px 40px #0003}.search select{border:0;background:#edf0f6;padding:8px;border-radius:9px;color:#344054}.search input{border:0;outline:0;flex:1;min-width:0;color:#202633}.search button,.primary{background:#f5bd32;color:#202633;border-radius:11px;padding:11px 14px;font-weight:650}.shortcuts{display:flex;justify-content:center;gap:17px;flex-wrap:wrap;margin:24px auto}.shortcut{display:grid;justify-items:center;gap:7px;background:transparent;font-size:11px}.tile{width:49px;height:49px;border:1px solid #ffffff24;background:#182338b8;border-radius:15px;display:grid;place-items:center;font-size:21px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:left}.card,.panel{border:1px solid #ffffff1d;background:#101827b8;backdrop-filter:blur(24px);border-radius:17px;padding:15px;box-shadow:0 15px 35px #0002}.card h3{font-size:13px;margin:0 0 12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;color:#dce3ef;font-size:12px}.row button,.link{background:transparent;color:#c5ccda}.swatches{display:flex;gap:8px}.swatch{width:46px;height:53px;border-radius:9px;border:2px solid transparent}.swatch.sel{border-color:#f5bd32}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.apps button{background:transparent;display:grid;justify-items:center;gap:5px;font-size:10px}.appico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#ffffff1a;font-size:17px}.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 13px;background:#172033a8;border:1px solid #ffffff26;border-radius:22px;backdrop-filter:blur(25px);max-width:calc(100% - 20px)}.dock button{width:39px;height:39px;border-radius:12px;background:#ffffff13;display:grid;place-items:center;font-size:19px}.dock button:hover{transform:translateY(-4px)}.window{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(650px,calc(100% - 24px));height:min(470px,calc(100% - 115px));background:#111827f5;border:1px solid #ffffff2a;border-radius:16px;box-shadow:0 30px 90px #0008;overflow:hidden;display:none}.window.open{display:flex;flex-direction:column}.titlebar{height:42px;display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid #ffffff1a}.dots{display:flex;gap:6px}.dots button{width:11px;height:11px;border-radius:50%;padding:0}.red{background:#ff6058}.yellow{background:#ffbd2e}.green{background:#28c840}.winname{margin:auto;font-size:12px}.winbody{padding:22px;overflow:auto}.address{display:flex;gap:8px;align-items:center;border:1px solid #ffffff25;background:#ffffff0b;padding:10px;border-radius:10px}.address input{background:transparent;color:white;border:0;outline:0;flex:1;min-width:0}.quick{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.quick button{padding:10px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0b}.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.settings-grid button{height:80px;border-radius:12px;border:2px solid transparent}.settings-grid button.sel{border-color:#f5bd32}.terminal{background:#080d14;color:#baf5c8;font:13px monospace;height:100%;padding:16px}.terminal input{background:transparent;border:0;color:white;outline:0}.note{width:100%;height:220px;background:#ffffff0a;border:1px solid #ffffff20;border-radius:12px;padding:12px;color:white}.status{position:absolute;bottom:91px;right:18px;color:#d3d9e5;font-size:11px}.mobilebar{display:none}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.cards .apps-card{display:none}.hero{top:47%;width:calc(100% - 30px)}.cards .card{padding:12px}.status{display:none}}@media(max-width:600px){.os{min-height:600px}.bar{height:32px}.bar .menus{display:none}.hero{top:46%;width:calc(100% - 28px)}.hero .bee{width:66px;height:66px}.hero h1{font-size:49px}.sub{font-size:12px;margin-bottom:19px}.search{gap:6px;padding:6px}.search select{font-size:11px;padding:8px 5px;max-width:92px}.search input{font-size:12px}.search button{padding:10px}.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px auto}.tile{width:54px;height:54px}.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:10px}.card h3{font-size:11px}.row{font-size:10px}.swatch{height:43px;width:36px}.dock{bottom:20px;left:12px;right:12px;transform:none;justify-content:space-around;gap:5px;padding:10px 6px}.dock button{width:38px;height:38px;font-size:17px}.mobilebar{display:block;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);height:4px;width:105px;background:#fff;border-radius:5px;z-index:9}.window{height:min(530px,calc(100% - 120px))}.settings-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="os" id="os"><header class="bar"><div class="brand"><img class="bee" src="/bee.svg" alt="Beezos bee"><b>Beezos</b><span class="menus">　Finder　 File　 Edit　 View　 Go　 Window　 Help</span></div><div id="clock"></div></header><section class="hero"><img class="bee" src="/bee.svg" alt="Pixel-art Minecraft-inspired bee"><div class="eyebrow">YOUR SPACE, REIMAGINED</div><h1>Beezos</h1><p class="sub">A calmer place to get things done.</p><form class="search" id="search"><select id="engine" aria-label="Search engine"><option>Google</option><option>Bing</option><option>DuckDuckGo</option></select><input id="query" placeholder="Search the web or enter a URL"/><button>Search ↗</button></form><div class="shortcuts"><button class="shortcut" data-url="https://youtube.com"><span class="tile">▶</span>YouTube</button><button class="shortcut" data-url="https://open.spotify.com"><span class="tile">♫</span>Spotify</button><button class="shortcut" data-url="https://discord.com/app"><span class="tile">◉</span>Discord</button><button class="shortcut" data-url="https://x.com"><span class="tile">𝕏</span>X</button><button class="shortcut" data-url="https://mail.google.com"><span class="tile">✉</span>Gmail</button><button class="shortcut" data-app="store"><span class="tile">＋</span>More apps</button></div><div class="cards"><section class="card"><h3>Recently opened</h3><div class="row"><span>◉　Shift Browser</span><button class="link" data-app="browser">Open</button></div><div class="row"><span>⚙　Settings</span><button class="link" data-app="settings">Open</button></div><div class="row"><span>▤　Notes</span><button class="link" data-app="notes">Open</button></div></section><section class="card"><h3>Personalize</h3><div class="swatches"><button class="swatch sel" data-wall="0" style="background:linear-gradient(145deg,#10172d,#566b9a)" title="Midnight"></button><button class="swatch" data-wall="1" style="background:linear-gradient(145deg,#07354b,#70d9c0)" title="Aurora"></button><button class="swatch" data-wall="2" style="background:linear-gradient(145deg,#523568,#f6b577)" title="Sunset"></button><button class="swatch" data-wall="3" style="background:linear-gradient(145deg,#071c42,#59b9cf)" title="Ocean"></button></div><div class="row"><span>Desktop wallpaper</span><button class="link" data-app="settings">Customize</button></div></section><section class="card apps-card"><h3>Your apps</h3><div class="apps"><button data-app="finder"><span class="appico">▣</span>Files</button><button data-app="browser"><span class="appico">◉</span>Browser</button><button data-app="settings"><span class="appico">⚙</span>Settings</button><button data-app="terminal"><span class="appico">⌘</span>Terminal</button></div></section></div></section><div class="status">● All systems ready　 ·　 Beezos Web OS</div><section class="window" id="window"><div class="titlebar"><div class="dots"><button class="red" id="close"></button><button class="yellow" id="min"></button><button class="green" id="max"></button></div><div class="winname" id="winname">Shift Browser</div><button class="link" id="dismiss">×</button></div><div class="winbody" id="winbody"></div></section><nav class="dock"><button data-app="finder" title="Files">▣</button><button data-app="browser" title="Shift Browser">◉</button><button data-app="notes" title="Notes">▤</button><button data-url="https://open.spotify.com" title="Spotify">♫</button><button data-url="https://youtube.com" title="YouTube">▶</button><button data-url="https://discord.com/app" title="Discord">◉</button><button data-app="settings" title="Settings">⚙</button><button data-app="terminal" title="Terminal">⌘</button><button data-app="store" title="Apps">＋</button></nav><div class="mobilebar"></div></main><script>
const $=s=>document.querySelector(s);const win=$('#window'),body=$('#winbody');let theme='dark',wall=0;function clock(){$('#clock').textContent=new Date().toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}clock();setInterval(clock,15000);function go(url){window.open(url,'_blank','noopener,noreferrer')}function app(name){win.classList.add('open');$('#winname').textContent=({browser:'Shift Browser · shift.com',settings:'Settings',terminal:'Terminal',finder:'Files',notes:'Notes',store:'App Gallery'})[name]||name;body.innerHTML='';if(name==='browser'){body.innerHTML='<div style="text-align:center;padding:30px 0"><img src="/bee.svg" width="55" alt="Beezos bee"><h2 style="font-size:29px">Shift Browser</h2><p style="color:#aab3c5">Your browser home · shift.com</p><form class="address" id="bsearch"><span>🔒</span><input id="bquery" placeholder="Search Google or type a URL"><button class="primary">Go ↗</button></form><div class="quick"><button data-url="https://shift.com">Open shift.com</button><button data-url="https://google.com">Google</button><button data-url="https://youtube.com">YouTube</button><button data-url="https://open.spotify.com">Spotify</button></div></div>';$('#bsearch').onsubmit=e=>{e.preventDefault();let q=$('#bquery').value.trim();if(q)go(/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}/i.test(q)?'https://'+q:'https://google.com/search?q='+encodeURIComponent(q))}}else if(name==='settings'){body.innerHTML='<h2>Appearance</h2><p style="color:#aab3c5">Make Beezos feel like yours.</p><h3>Wallpaper</h3><div class="settings-grid"><button data-wall="0" style="background:linear-gradient(145deg,#10172d,#566b9a)">Midnight</button><button data-wall="1" style="background:linear-gradient(145deg,#07354b,#70d9c0)">Aurora</button><button data-wall="2" style="background:linear-gradient(145deg,#523568,#f6b577)">Sunset</button><button data-wall="3" style="background:linear-gradient(145deg,#071c42,#59b9cf)">Ocean</button></div><h3>Appearance</h3><div class="quick"><button id="theme">Toggle light / dark mode</button></div>'}else if(name==='terminal'){body.innerHTML='<div class="terminal"><div id="out">Beezos Terminal 1.0<br>Type help to see commands.<br></div><form id="cmd"><span>guest@beezos % </span><input id="cmdin" autocomplete="off"></form></div>';$('#cmd').onsubmit=e=>{e.preventDefault();let c=$('#cmdin').value.trim(),o=$('#out');if(c==='clear')o.innerHTML='';else if(c==='help')o.innerHTML+='help · ls · echo [text] · theme dark|light · date<br>';else if(c==='ls')o.innerHTML+='Applications　Desktop　Documents　Downloads<br>';else if(c.startsWith('echo '))o.innerHTML+=c.slice(5)+'<br>';else if(c==='date')o.innerHTML+=new Date().toString()+'<br>';else if(c.startsWith('theme ')){theme=c.slice(6)==='light'?'light':'dark';$('.os').style.filter=theme==='light'?'brightness(1.3)':'none';o.innerHTML+='Theme changed.<br>'}else o.innerHTML+='Command not found: '+c+'<br>';$('#cmdin').value=''}}else if(name==='notes'){body.innerHTML='<h2>Quick Notes</h2><textarea class="note" id="note" placeholder="Write something…">Welcome to Beezos.\n\nYour ideas live here.</textarea><p style="color:#aab3c5;font-size:11px">Notes stay in this open page only.</p>'}else if(name==='finder'){body.innerHTML='<h2>My Files</h2><p style="color:#aab3c5">Browse your demo workspace</p><div class="quick"><button>📁 Documents</button><button>🖼 Pictures</button><button>⬇ Downloads</button><button>▤ Notes</button></div>'}else{body.innerHTML='<h2>App Gallery</h2><p style="color:#aab3c5">Your favorite services</p><div class="quick"><button data-url="https://youtube.com">YouTube</button><button data-url="https://open.spotify.com">Spotify</button><button data-url="https://discord.com/app">Discord</button><button data-url="https://x.com">X</button><button data-url="https://mail.google.com">Gmail</button></div>'}body.querySelectorAll('[data-url]').forEach(b=>b.onclick=()=>go(b.dataset.url));body.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>setwall(+b.dataset.wall));let t=$('#theme');if(t)t.onclick=()=>{$('.os').style.filter=$('.os').style.filter?'':'brightness(1.3)'}}function setwall(n){wall=n;let bg=['radial-gradient(ellipse at 75% 15%,#566a9c,transparent 35%),linear-gradient(135deg,#111827,#263453)','radial-gradient(ellipse at 75% 25%,#64d9c8,transparent 34%),linear-gradient(135deg,#071c36,#0b3550)','radial-gradient(ellipse at 70% 30%,#ffcf89,transparent 24%),linear-gradient(140deg,#422e68,#cf7b8a 55%,#f7b777)','radial-gradient(ellipse at 70% 30%,#7fd6ed,transparent 26%),linear-gradient(145deg,#071c42,#126aa0 58%,#59b9cf)'];$('.os').style.background=bg[n];document.querySelectorAll('[data-wall]').forEach(b=>b.classList.toggle('sel',+b.dataset.wall===n))}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.app)app(b.dataset.app);if(b.dataset.url)go(b.dataset.url);if(b.dataset.wall!==undefined)setwall(+b.dataset.wall)});$('#search').onsubmit=e=>{e.preventDefault();let q=$('#query').value.trim();if(!q)return;go(/^https?:\/\//i.test(q)?q:/^[\w-]+\.[a-z]{2,}/i.test(q)?'https://'+q:($('#engine').value==='Google'?'https://google.com/search?q=':$('#engine').value==='Bing'?'https://bing.com/search?q=':'https://duckduckgo.com/?q=')+encodeURIComponent(q))};$('#close').onclick=$('#dismiss').onclick=()=>win.classList.remove('open');$('#min').onclick=()=>win.classList.remove('open');$('#max').onclick=()=>win.style.width=win.style.width==='100%'?'min(650px,calc(100% - 24px))':'100%';
</script></body></html>
